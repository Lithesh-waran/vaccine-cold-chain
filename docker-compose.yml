services:
  mongodb:
    image: mongo:7
    container_name: coldchain-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coldchain-app
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/vaccine_cold_chain
      - JWT_SECRET=production_secret_must_be_at_least_32_characters_long_123456
      - CORS_ORIGINS=*
      - SERVE_STATIC=true
    depends_on:
      - mongodb

volumes:
  mongo-data:
